<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Russia</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',Arial;background:linear-gradient(45deg,#667eea,#764ba2,#f093fb,#f5576c);background-size:400% 400%;animation:gradient 8s ease infinite;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card{background:rgba(255,255,255,0.95);width:100%;max-width:420px;border-radius:30px;padding:35px 20px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.4);backdrop-filter:blur(10px)}
.avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 25px rgba(0,0,0,.2)}
h1{font-size:32px;color:#222;margin:15px 0 5px}
.bio{color:#666;font-size:14px;margin-bottom:15px}
.forever{background:linear-gradient(45deg,#ff6a00,#ee0979);color:white;padding:12px 20px;border-radius:25px;font-size:18px;font-weight:bold;margin:15px 0 25px;box-shadow:0 8px 20px rgba(238,9,121,.4);letter-spacing:1px;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 8px 20px rgba(238,9,121,.4)}to{box-shadow:0 12px 30px rgba(238,9,121,.7)}}
.btn{display:block;padding:14px;margin-bottom:12px;border-radius:50px;color:white;text-decoration:none;font-weight:bold;font-size:17px;transition:.3s}
.btn:hover{transform:scale(1.05)}
.fb{background:#1877F2}
.tiktok{background:#000}
.wa{background:#25D366}
</style>
</head>
<body>
<div class="card">
<img class="avatar" src="profile.jpg" alt="Nour">
<h1>Nour Russia</h1>
<p class="bio">مبرمج من صفط اللبن - الجيزة 💻</p>

<div class="forever">April 12 4:56 Forever 🧿🫶🏻</div>

<a class="btn fb" href="https://www.facebook.com/share/1HwsPXxBKT/" target="_blank">📘 Facebook</a>
<a class="btn tiktok" href="https://www.tiktok.com/@33_n.o.u.r_xx" target="_blank">🎵 TikTok</a>
<a class="btn wa" href="https://wa.me/201110449830" target="_blank">💬 WhatsApp</a>
</div>
</body>
</html>
