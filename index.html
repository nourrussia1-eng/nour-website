<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Russia - Rahom Forever</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb,#f5576c);background-size:400% 400%;animation:g 8s ease infinite;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
@keyframes g{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card{background:white;width:100%;max-width:400px;border-radius:25px;padding:30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(45deg,#ff6a00,#ee0979);display:flex;justify-content:center;align-items:center;color:white;font-size:45px;font-weight:bold;margin:0 auto}
h1{font-size:30px;margin:15px 0 5px}
.bio{color:#666;font-size:14px;margin-bottom:15px}
.forever{background:linear-gradient(45deg,#ff6a00,#ee0979,#ff6a00);background-size:200% 200%;animation:glow 2s infinite;color:white;padding:12px 20px;border-radius:50px;font-weight:bold;font-size:18px;margin:15px 0;box-shadow:0 5px 20px rgba(238,9,121,0.4)}
@keyframes glow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.btn{display:block;padding:14px;margin-bottom:12px;border-radius:12px;color:white;text-decoration:none;font-weight:bold;font-size:16px;transition:0.3s}
.btn:active{transform:scale(0.97)}
.fb{background:#1877F2}.tiktok{background:#000}.insta{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.love{margin-top:20px;color:#ee0979;font-weight:bold;font-size:22px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.date{margin-top:8px;color:#764ba2;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div class="avatar">N</div>
<h1>Nour Russia</h1>
<p class="bio">مبرمج من صفت اللبن - الجيزة</p>
<div class="forever">🧿 April 12 4:56 Forever 🫶🏻</div>
<a class="btn fb" href="https://www.facebook.com/share/1F4ZbHoJ3t/" target="_blank">Facebook</a>
<a class="btn tiktok" href="https://www.tiktok.com/@nourrussia1?_t=ZS-90zE1jLqjQw&_r=1" target="_blank">TikTok</a>
<a class="btn insta" href="https://www.instagram.com/nour_russia1?igsh=c2p5aGgzY3NreW1q" target="_blank">Instagram</a>
<div class="love">I love rahom ❤️</div>
<div class="date">Forever Together 💍</div>
</div>
</body>
</html>
